name: CI Lite (Two-Lane via tags-workflows)

# PURPOSE: Demonstrate consuming tags-workflows reusable workflow
# with the two-lane pattern for public repositories
#
# TWO-LANE PATTERN:
#   Lane 1 (pr-validate): Untrusted PR code runs on GitHub-hosted, no secrets
#   Lane 2 (main-ci): Trusted pushes to main run with full capabilities
#
# SHA PIN: Pinned to tags-workflows commit for immutable references
#
# ALLOWLIST: theangrygamershowproductions org is allowlisted in actions-policy-enforcement.yml

on:
  pull_request:
  push:
    branches: [main]

# NOTE: Global permissions set to minimum. The reusable workflow
# defines its own permissions based on the 'trusted' parameter.
# Lane 1 (untrusted) inherits read-only. Lane 2 (trusted) gets
# elevated permissions from the called workflow's permission block.
permissions:
  contents: read

jobs:
  # Lane 1: Untrusted PR validation (GitHub-hosted, no secrets)
  pr-validate:
    if: github.event_name == 'pull_request'
    uses: theangrygamershowproductions/tags-workflows/.github/workflows/ci-lite.yml@ce3b63239d05403ecdf582c95fda779e0c33bf9e
    with:
      runner: ubuntu-latest
      trusted: false

  # Lane 2: Trusted branch CI (self-hosted, secrets allowed)
  # NOTE: Secrets are inherited automatically when trusted=true
  # per GitHub Actions reusable workflow semantics
  main-ci:
    if: github.event_name == 'push'
    uses: theangrygamershowproductions/tags-workflows/.github/workflows/ci-lite.yml@ce3b63239d05403ecdf582c95fda779e0c33bf9e
    secrets: inherit
    # runner defaults to [self-hosted, tagsdev] per workflow defaults
    # trusted defaults to true
